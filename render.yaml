services:
  - type: web
    name: ujmah-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # User will set this in Render dashboard
      - key: DATABASE_URL
        sync: false # User will set their Neon DB url in Render dashboard
      - key: DIRECT_URL
        sync: false # User will set their Neon DB url in Render dashboard
